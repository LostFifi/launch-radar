<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Radar – Raketenstarts live</title>
<style>/*LEAFLET_CSS*/</style>

<style>
  :root{--bg:#0b0f17;--panel:#121826;--line:#232c3f;--text:#e6ebf5;--mute:#8a96ad;--acc:#4ea1ff;--go:#2ecc71;--tbd:#f5b041;--live:#ff3b3b;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #map{position:absolute;inset:0}
  header{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:10px 12px;background:linear-gradient(#0b0f17ee,#0b0f1700)}
  .logo{font-weight:800;letter-spacing:.5px;font-size:16px}
  .logo span{color:var(--acc)}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--text);font-size:13px}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  #next{margin-left:auto;font-variant-numeric:tabular-nums}
  #panel{position:absolute;z-index:1001;background:var(--panel);border:1px solid var(--line);overflow:auto;display:none;
    box-shadow:0 10px 40px #000a}
  @media (min-width:800px){#panel{top:60px;right:12px;bottom:12px;width:430px;border-radius:14px}}
  @media (max-width:799px){#panel{left:0;right:0;bottom:0;max-height:72vh;border-radius:16px 16px 0 0}}
  #panel .hd{position:sticky;top:0;background:var(--panel);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:2}
  #panel .hd h2{margin:0;font-size:16px;flex:1}
  #panel .x{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;line-height:1}
  .sec{padding:12px 14px;border-bottom:1px solid var(--line)}
  .sec h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute)}
  .grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
  .grid b{color:var(--mute);font-weight:500}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
  .video{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .btn{display:inline-block;margin-top:8px;background:var(--acc);color:#fff;text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px}
  .btn.sec2{background:#273149}
  .cd{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .tl li span:first-child{min-width:78px;color:var(--acc);font-variant-numeric:tabular-nums}
  .hero{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .hero .cr{position:absolute;right:6px;bottom:4px;font-size:10px;color:#fffc;text-shadow:0 1px 3px #000}
  .hero .patch{position:absolute;left:10px;bottom:10px;width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 2px 6px #000)}
  .item{display:flex;gap:10px;align-items:center}
  .item .th{width:64px;height:48px;border-radius:6px;object-fit:cover;background:#1a2133;flex:none}
  .item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:#18203a}
  .item small{color:var(--mute)}
  .mute{color:var(--mute)}
  .note{font-size:12px;color:var(--mute);margin-top:6px}
  input[type=range]{width:100%}
  .pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #0008;position:relative}
  .pin .n{position:absolute;top:-10px;right:-12px;background:#fff;color:#000;font-size:10px;font-weight:800;border-radius:8px;padding:0 4px}
  .pin.live::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--live);animation:p 1.4s infinite}
  @keyframes p{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
  .rk{font-size:22px;filter:drop-shadow(0 0 6px #4ea1ff)}
  .lnd{font-size:18px}
  .leaflet-container{background:#0b0f17}
  #globe{position:absolute;inset:0;z-index:900;display:none;touch-action:none;cursor:grab}
  .globe-on .leaflet-control-container{display:none}
  #layers{position:absolute;z-index:1003;top:100px;left:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:none;min-width:250px;box-shadow:0 10px 40px #000a}
  #layers label{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
  #layers input{width:18px;height:18px;accent-color:var(--acc)}
  #layers h4{margin:6px 0 2px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
  #layers .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  #live{position:absolute;z-index:999;top:104px;left:12px;background:#2a0f14;border:1px solid var(--live);color:#fff;border-radius:10px;padding:6px 12px;display:none;cursor:pointer;font-size:13px;max-width:calc(100vw - 24px);text-align:left}
  @media (min-width:800px){#panel.wide{width:min(1150px,calc(100vw - 24px))}}
  @media (max-width:799px){#panel.wide{max-height:88vh}}
  .tabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:49px;background:var(--panel);z-index:2}
  .tabs .chip.on{background:var(--acc);border-color:var(--acc)}
  #timebar{position:absolute;z-index:998;left:50%;transform:translateX(-50%);bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:none;gap:4px;align-items:center;font-size:13px;box-shadow:0 6px 24px #0008;white-space:nowrap}
  #timebar .chip{padding:4px 9px}
  @media (max-width:520px){#timebar .tbx{display:none} #timebar{font-size:12px;bottom:10px} #timebar .chip{padding:4px 7px}}
  #timebar b{font-variant-numeric:tabular-nums;margin:0 6px}
  .bars{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
  .bars .tr{height:14px;background:#1a2133;border-radius:0 4px 4px 0;overflow:hidden}
  .bars .f{height:100%;background:var(--acc);border-radius:0 4px 4px 0}
  .bars .v{font-variant-numeric:tabular-nums;color:var(--mute);min-width:28px;text-align:right}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .tile{background:#18203a;border-radius:10px;padding:10px}
  .tile .big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .tile small{color:var(--mute)}
  .months{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
  .months div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mute)}
  .months i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:1px}
  .months span{margin-top:3px}
  .dbctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
  .dbctl input[type=search]{flex:1;min-width:150px;background:#0b0f17;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px}
  .tw{overflow:auto}
  table.db{border-collapse:collapse;font-size:12.5px;width:100%;white-space:nowrap}
  table.db th{position:sticky;top:0;background:#18203a;text-align:left;padding:7px 8px;cursor:pointer;color:var(--mute);font-weight:600;user-select:none}
  table.db th.s{color:var(--text)}
  table.db td{padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.db td.num,table.db th.num{text-align:right}
  table.db tr:hover td{background:#16203a}
  table.db tr.sel td{background:#1d2b4d}
  table.cmp{border-collapse:collapse;width:100%;font-size:13px}
  table.cmp th,table.cmp td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
  table.cmp th{color:var(--mute);font-weight:500;width:130px}
  table.cmp .mb{height:5px;background:var(--acc);border-radius:0 3px 3px 0;margin-top:4px}
  table.cmp img{width:100%;max-width:220px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#18203a}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700}
  @media (max-width:560px){ header .lbl{display:none} header{gap:6px} header .chip{padding:6px 9px} }
  .logo{display:flex;align-items:center;gap:7px}
  .logo svg{width:20px;height:20px;color:var(--acc)}
  .logo span{margin-left:-7px}
  .chip.ic{display:inline-flex;align-items:center;gap:6px}
  .rkw{width:28px;height:28px;display:flex;align-items:center;justify-content:center;transition:transform .2s linear}
  .rkw svg{width:26px;height:26px;filter:drop-shadow(0 0 6px #4ea1ffcc)}
  .lm{width:11px;height:11px;transform:rotate(45deg);background:#0b0f17;border:2.2px solid var(--c);box-shadow:0 0 8px var(--c)}
  .lg{display:inline-block;width:8px;height:8px;transform:rotate(45deg);border:2px solid var(--c);margin:0 5px 0 2px}
  .deplbl{position:absolute;transform:translate(-50%,-150%);white-space:nowrap;font-size:11px;font-weight:700;color:#ff8fe6;text-shadow:0 1px 3px #000,0 0 6px #000}
  .spd{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
  .spd .chip{padding:4px 8px;font-size:12px}
  #panel .grab{display:none}
  @media (max-width:799px){
    #panel .grab{display:block;position:sticky;top:0;z-index:3;background:var(--panel);padding:8px 0 2px;cursor:pointer;touch-action:none}
    #panel .grab i{display:block;width:44px;height:5px;border-radius:3px;background:#3a4560;margin:0 auto}
    #panel .hd{top:15px}
  }
  #panel .minbtn{background:none;border:0;color:var(--mute);cursor:pointer;padding:2px 4px;line-height:0}
  #panel .minbtn svg{transition:transform .2s}
  #panel.min .minbtn svg{transform:rotate(180deg)}
  #panel.min{overflow:hidden}
  @media (max-width:799px){ #panel.min{max-height:none} }
  @media (min-width:800px){ #panel.min{bottom:auto} }
  #panel.min > :not(.hd):not(.grab):not(.mini){display:none}
  #panel .mini{display:none;align-items:center;gap:10px;padding:8px 14px 12px}
  #panel.min .mini.on{display:flex}
  #panel .mini b{font-variant-numeric:tabular-nums}
  #panel .mini .mute{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #panel .mini .chip{display:inline-flex;align-items:center;padding:6px 10px}
  #panel.min .hd h2{font-size:14px}
  #panel .simtop{padding:10px 14px}
  #panel .simtop input[type=range]{margin:6px 0 8px}
  .sttop{display:flex;gap:12px;align-items:flex-start}
  .stimg{width:92px;height:92px;border-radius:10px;object-fit:cover;flex:none;background:#18203a}
  .stimg.ph{display:flex;align-items:center;justify-content:center;color:#4a5878}
  .stimg.ph svg{width:36px;height:36px}
  .sthr{border:0;border-top:1px solid var(--line);margin:12px 0}
  #tele{position:absolute;z-index:1004;left:12px;bottom:70px;width:344px;max-width:calc(100vw - 24px);max-height:calc(100vh - 160px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:none;box-shadow:0 10px 40px #000a}
  #tele .thd{display:flex;align-items:center;gap:8px;margin-bottom:8px} #tele .thd b{flex:1}
  #tele .x{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;line-height:1}
  #tele .tbig{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
  #tele .tbig div{background:#18203a;border-radius:8px;padding:6px 8px} #tele .tbig small{display:block;color:var(--mute);font-size:11px}
  #tele .tbig b{font-size:16px;font-variant-numeric:tabular-nums}
  #tele canvas{width:100%;display:block;border-radius:8px;background:#000;margin-bottom:6px} #tele #tSpark{background:#0f1525;height:54px}
  #tele #tPrev{cursor:crosshair;touch-action:none}
  #tele .tbtns{display:flex;gap:6px;flex-wrap:wrap} #tele .tsteps{margin:0 0 8px;padding-left:18px;font-size:13px} #tele .tsteps li{margin-bottom:4px}
  #pip{position:absolute;z-index:1005;right:460px;bottom:70px;width:340px;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none;box-shadow:0 10px 40px #000c}
  #pip.big{width:min(640px,calc(100vw - 24px))}
  @media (max-width:799px){#pip{right:12px;left:auto;top:120px;bottom:auto;width:calc(100vw - 24px);max-width:420px}}
  #pip .pbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);cursor:move;touch-action:none}
  #pip .pbar b{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pip .pbar .chip{padding:3px 8px;font-size:12px}
  #pip .pb{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
  #pip .pv{position:relative;padding-top:56.25%} #pip iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #satcv{position:absolute;inset:0;z-index:450;pointer-events:none}
  #msg{position:absolute;z-index:1002;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:10px;display:none}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <div class="logo" data-ic="rocket">Launch<span>Radar</span></div>
  <button class="chip on" data-f="all">Alle</button>
  <button class="chip" data-f="spacex">SpaceX</button>
  <button class="chip" data-f="starship">Starship</button>
  <button class="chip ic" id="listBtn" data-ic="list"><span class="lbl">Liste</span></button>
  <button class="chip ic" id="globeBtn" data-ic="globe"><span class="lbl">Globus</span></button>
  <button class="chip ic" id="layerBtn" data-ic="layers"><span class="lbl">Ebenen</span></button>
  <button class="chip ic" id="statBtn" data-ic="stats"><span class="lbl">Statistik</span></button>
  <button class="chip ic" id="dbBtn" data-ic="rocket"><span class="lbl">Raketen</span></button>
  <div class="chip" id="next">Lade Starts…</div>
</header>
<canvas id="globe"></canvas>
<div id="layers"></div>
<div id="live"></div>
<div id="panel"></div>
<div id="timebar"></div>
<div id="tele"></div>
<div id="pip"></div>
<div id="msg"></div>

<script>
// ===================== Eingebettete Daten =====================
const WORLD = /*WORLD*/;
const SNAPSHOT = /*SNAP*/;
const SNAP_TS = "/*SNAPTS*/";
const TLE_SNAP = /*TLE*/;
const IMG_SNAP = /*IMG*/;
const PAST_SNAP = /*PAST*/;
const ROCKETS = /*ROCKETS*/;
const STATS = /*STATS*/;

// ===================== Icons (SVG statt Emojis) =====================
const RK_PATH="M12 1.5c2.6 2.3 4.1 5.8 4.1 9.8v4.2l2.4 2.9v2.1l-4.6-1.6h-3.8l-4.6 1.6v-2.1l2.4-2.9v-4.2c0-4 1.5-7.5 4.1-9.8z";
const ICON={
  rocket:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="'+RK_PATH+'"/><circle cx="12" cy="9.5" r="1.7"/></svg>',
  list:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>',
  globe:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4.2" ry="9.5"/><path d="M2.5 12h19"/></svg>',
  map:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6l6-2.5 6 2.5 6-2.5v14.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 3.5v14.5M15 6v14.5"/></svg>',
  layers:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9.5 5-9.5 5-9.5-5z"/><path d="M2.5 12.5l9.5 5 9.5-5"/><path d="M2.5 16.5l9.5 5 9.5-5"/></svg>',
  stats:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></svg>',
  clock:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  bell:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="vertical-align:-2px"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  sat:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" style="vertical-align:-2px"><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M2 8.5l5 1v5l-5 1zM22 8.5l-5 1v5l5 1zM12 15v4"/></svg>',
  reuse:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#7be07b" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-1px"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>'
};
document.querySelectorAll("[data-ic]").forEach(el=>el.insertAdjacentHTML("afterbegin",ICON[el.dataset.ic]));
// Lande-Markierungen: Farbe je Art
const LAND={booster:{c:"#2ecc71",t:"Booster-Landung"},ship:{c:"#4ec9e0",t:"Drohnenschiff"},catch:{c:"#ffd25a",t:"Catch / Rückkehr"},splash:{c:"#c86bff",t:"Wasserung"},reentry:{c:"#ff6b3d",t:"Wiedereintritt"},impact:{c:"#8a96ad",t:"Absturzgebiet"}};
function landHtml(k){ return `<div class="lm" style="--c:${LAND[k].c}"></div>`; }
function bearing(a,b){ const r=Math.PI/180, la1=a[0]*r, la2=b[0]*r, dl=(b[1]-a[1])*r;
  return Math.atan2(Math.sin(dl)*Math.cos(la2), Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dl))/r; }
const RK2D=new Path2D(RK_PATH);
function drawRocket(c,x,y,ang){ c.save(); c.translate(x,y); c.rotate(ang); c.scale(1.15,1.15); c.translate(-12,-12);
  c.shadowColor="#4ea1ff"; c.shadowBlur=10; c.fillStyle="#fff"; c.fill(RK2D); c.shadowBlur=0; c.lineWidth=1.3; c.strokeStyle="#4ea1ff"; c.stroke(RK2D); c.restore(); }
function drawLandG(c,x,y,k){ c.save(); c.translate(x,y); c.rotate(Math.PI/4); c.fillStyle="#0b0f17"; c.strokeStyle=LAND[k].c; c.lineWidth=2.2; c.fillRect(-5,-5,10,10); c.strokeRect(-5,-5,10,10); c.restore(); }
// ===================== Konfiguration =====================
const API = "https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=40&mode=detailed&hide_recent_previous=false";
const API_DEV = API.replace("ll.thespacedevs","lldev.thespacedevs"); // Fallback (keine Rate-Limits, evtl. älter)
const CACHE_MIN = 15;  // Free-API erlaubt ~15 Abrufe/Stunde → Cache
const OMEGA_E = 7.2921159e-5, R_E = 6371;

// Bekannte Landezonen (Fallback, falls API keine Koordinaten liefert)
const LZ = {
  "LZ-1":[28.4858,-80.5444], "LZ-2":[28.4876,-80.5441], "LZ-40":[28.5618,-80.5772],
  "LZ-4":[34.6328,-120.6156], "SLC-6":[34.5813,-120.6266],
  "STARBASE":[25.9967,-97.1543], "OLP-A":[25.9967,-97.1543], "OLP-B":[25.9963,-97.1559]
};

// ===================== Karte =====================
const map = L.map("map",{zoomControl:false,worldCopyJump:true,minZoom:2}).setView([25,-40],3);
L.control.zoom({position:"bottomleft"}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{
  attribution:'Karte &copy; Esri | Daten: The Space Devs (Launch Library 2)',maxZoom:12}).addTo(map);
// Eingebaute Weltkarte (funktioniert auch offline / in Vorschauen)
// Für die 2D-Karte: Polygone über die Datumsgrenze (Fiji, Russland) entwirren – sonst entstehen Querstreifen
const WORLD2D=JSON.parse(JSON.stringify(WORLD));
(function(){ const fx=ring=>{ const lo=ring.map(p=>p[0]); if(Math.max(...lo)-Math.min(...lo)<=180||Math.min(...ring.map(p=>p[1]))<-60) return ring; return ring.map(p=>[p[0]<0?p[0]+360:p[0],p[1]]); };
  WORLD2D.features.forEach(f=>{ const g=f.geometry; g.coordinates = g.type==="Polygon" ? g.coordinates.map(fx) : g.coordinates.map(pl=>pl.map(fx)); }); })();
for(const sh of [-360,0,360]) L.geoJSON(WORLD2D,{coordsToLatLng:c=>L.latLng(c[1],c[0]+sh),style:{color:"#3a4560",weight:.7,fillColor:"#1a2133",fillOpacity:1},interactive:false}).addTo(map);
const padLayer = L.layerGroup().addTo(map);
const routeLayer = L.layerGroup().addTo(map);

let curK = 0, curP = null, follow = false, playSpeed = 60, curHdg = 0, launches = [], filter = "all", selected = null, simTimer = null, rocketMarker = null, curTrack = null, curPos = null, padGroups = [];

// ===================== Daten laden =====================
async function load(){
  let cached=null;
  try{ cached = JSON.parse(localStorage.getItem("lr_cache")||"null"); }catch(e){}
  if(cached && Date.now()-cached.ts < CACHE_MIN*60e3){ launches = cached.data; return render(); }
  for(const url of [API, API_DEV]){
    try{
      const r = await fetch(url);
      if(!r.ok) throw new Error(r.status);
      const j = await r.json();
      launches = j.results||[];
      try{ localStorage.setItem("lr_cache",JSON.stringify({ts:Date.now(),data:launches})); }catch(e){}
      if(url===API_DEV) toast("Hinweis: Fallback-Daten (dev-Server) – evtl. nicht ganz aktuell");
      return render();
    }catch(e){ console.warn("Fehler",url,e); }
  }
  if(cached){ launches=cached.data; toast("Offline – zeige zwischengespeicherte Daten"); return render(); }
  launches = SNAPSHOT; render();
  toast("Live-Daten blockiert – zeige Schnappschuss vom "+SNAP_TS+". Im Browser (Chrome) öffnen für Live-Daten.");
}

function visible(){
  return launches.filter(l=>{
    const p=(l.launch_service_provider?.name||"").toLowerCase();
    const r=(l.rocket?.configuration?.full_name||l.rocket?.configuration?.name||"").toLowerCase();
    if(filter==="spacex") return p.includes("spacex");
    if(filter==="starship") return r.includes("starship");
    return true;
  });
}

// ===================== Darstellung =====================
function statusColor(l){
  const a=(l.status?.abbrev||"").toLowerCase();
  if(l.webcast_live||a==="in flight") return "var(--live)";
  if(a==="go") return "var(--go)";
  if(a==="success") return "var(--go)";
  if(/fail/.test(a)) return "var(--live)";
  return "var(--tbd)";
}
function render(){
  padLayer.clearLayers();
  if(LAYERS && !LAYERS.pads){ padGroups=[]; return updateNext(); }
  const byPad = {}; padGroups = [];
  visible().forEach(l=>{ if(!l.pad) return; (byPad[l.pad.id] ||= []).push(l); });
  Object.values(byPad).forEach(list=>{
    padGroups.push(list);
    list.sort((a,b)=>new Date(a.net)-new Date(b.net));
    const l=list[0], live=list.some(x=>x.webcast_live);
    const icon=L.divIcon({className:"",iconSize:[18,18],
      html:`<div class="pin ${live?"live":""}" style="background:${statusColor(l)}">${list.length>1?`<span class="n">${list.length}</span>`:""}</div>`});
    L.marker([+l.pad.latitude,+l.pad.longitude],{icon}).addTo(padLayer)
      .bindTooltip(`${l.name}<br><small>${fmtDate(l.net)}</small>`)
      .on("click",()=> list.length>1 ? showList(list, l.pad.name) : select(l));
  });
  updateNext();
}

function updateNext(){
  const v=visible().filter(l=>new Date(l.net)>Date.now()-3600e3).sort((a,b)=>new Date(a.net)-new Date(b.net));
  const n=v[0]; const el=document.getElementById("next");
  if(!n){el.textContent="Keine Starts";return;}
  el.innerHTML=`Nächster: <b>${esc(n.name.split("|")[1]||n.name)}</b> · ${countdown(n.net)}`;
  el.onclick=()=>select(n);
}

function showList(list,title,tab){
  clearSat(); stopSim(); routeLayer.clearLayers(); selected=null; curTrack=null; curPos=null;
  const P=document.getElementById("panel"); P.classList.remove("wide");
  P.innerHTML=`<div class="hd"><h2>${esc(title||"Kommende Starts")}</h2><button class="x" onclick="closeP()">×</button></div>`+
    (tab?`<div class="tabs"><button class="chip ${tab==="up"?"on":""}" onclick="showStartList('up')">Kommende</button><button class="chip ${tab==="past"?"on":""}" onclick="showStartList('past')">Vergangene</button></div>`:"")+
    list.map((l,i)=>`<div class="item" data-i="${i}">${imgTag(l,true)}<div><b>${esc(l.name)}</b><br>
      <small>${fmtDate(l.net)} · ${esc(l.pad?.location?.name||"")}</small><br>
      <span class="badge" style="background:${statusColor(l)};color:#000">${esc(l.status?.abbrev||"")}</span>
      ${l.webcast_live?'<span class="badge" style="background:var(--live)">● LIVE</span>':""}
      ${landIcons(l)} ${REM[l.id]?ICON.bell:""}</div></div>`).join("");

  P.style.display="block"; P.scrollTop=0;
}
function closeP(){ follow=false; clearSat(); document.getElementById("panel").classList.remove("min"); document.getElementById("panel").classList.remove("wide"); document.getElementById("panel").style.display="none"; stopSim(); routeLayer.clearLayers(); selected=null; curTrack=null; curPos=null; }

function liveFollow(l,est){
  simTimer=setInterval(()=>{
    const t=(Date.now()-new Date(l.net))/1000; if(t>est.tMax) return stopSim();
    const s=document.getElementById("sim"); if(s) s.value=t; placeRocket(t);
  },1000);
}
function stopSim(resetBtn=true){
  if(simTimer){clearInterval(simTimer); simTimer=null;}
  const b=document.getElementById("play"); if(b&&resetBtn!==false) b.textContent="▶ Flug simulieren";
}

// ===================== Bahn-Schätzung =====================
function estimateProfile(l){
  const lat=+l.pad.latitude, lon=+l.pad.longitude;
  const name=(l.name||"").toLowerCase(), orb=(l.mission?.orbit?.abbrev||"").toUpperCase();
  const rocket=(l.rocket?.configuration?.full_name||l.rocket?.configuration?.name||"").toLowerCase();
  const vandenberg = lon<-119 && lon>-122 && lat>34 && lat<35.5;
  let inc, south=false, suborbital=false, tMax=90*60;

  const sub = orb.startsWith("SUB");
  if(rocket.includes("starship")){ inc=26.5; suborbital=sub; tMax=sub?70*60:90*60; }
  else if(sub){ inc=Math.abs(lat)+0.05; tMax=600; }
  else if(/shenzhou|tianzhou|tiangong|mengzhou/.test(name)) inc=41.5;
  else if(/\biss\b|crew|crs|cygnus|dragon|soyuz ms|progress|axiom|\bax-|htv|dream chaser|starliner/.test(name)) inc=51.64;
  else if(name.includes("starlink")||/starlink group/i.test(l.mission?.description||"")){
    const g=+((name+" "+(l.mission?.description||"").toLowerCase()).match(/group (\d+)/)||[])[1];
    inc = vandenberg ? ({11:53,13:97.6,15:70,17:97}[g]||70) : 43; }
  else if(orb==="SSO") inc=97.6;
  else if(vandenberg && ["LEO","PO",""].includes(orb)) inc = orb==="PO"?90:70;   // Vandenberg: typisch 70° (Richtung Süd-Südost über den Pazifik)
  else if(orb==="PO") inc=90;
  else if(orb==="MEO") inc=55;
  else if(orb==="HEO") inc=63.4;
  else if(["GTO","GEO","GSO","SUB-GEO","TLI","LO","HCO","SO","L1","L2"].includes(orb)) inc=Math.abs(lat);
  else inc=Math.max(Math.abs(lat)+2,45);

  if(vandenberg) south=true;
  if(inc>80 && lat>30 && !vandenberg) south=true;      // z.B. China SSO → Richtung Süden
  if(inc<Math.abs(lat)) inc=Math.abs(lat)+0.05;         // physikalisch nicht erreichbar → nach Osten

  const desc=l.mission?.description||"";
  let orbits=1, P=5400;
  if(rocket.includes("starship") && !sub){
    const mo=desc.match(/(\d+)\s+orbits?/i); orbits = mo ? +mo[1] : 1;
    const mh=desc.match(/(\d{3,4})\s*km/i); if(mh){ const a=R_E+ +mh[1]; P=2*Math.PI*Math.sqrt(a**3/398600.4418); }
    tMax = orbits*P;
  }
  // Was passiert mit der Oberstufe nach dem Aussetzen?
  let stage=null;
  if(!rocket.includes("starship") && !sub){
    const pp=payloadPlan(l), spx=/spacex/i.test(l.launch_service_provider?.name||"");
    const low=["LEO","SSO","PO","VLEO",""].includes(orb) || /iss|crew|crs|dragon/.test(name);
    const esc_=["TLI","LO","HCO","SO","L1","L2","MARS","HELIOCENTRIC"].some(x=>orb.startsWith(x));
    if(esc_) stage={mode:"escape",label:"Oberstufe verlässt mit der Nutzlast die Erdumlaufbahn"};
    else if(spx && low){
      const tdl=(()=>{ const e=(l.timeline||[]).find(t=>/deorbit burn start/i.test(t.type?.abbrev||"")); return e?relSec(e.relative_time):null; })();
      const Td=tdl ?? ((pp?pp.t1:3700)+35*60), Tre=Td+15*60;
      stage={mode:"deorbit",Td,Tre,src:tdl!=null?"laut Timeline":"geschätzt",label:"Oberstufe: Deorbit-Burn, dann Wiedereintritt und Verglühen über dem Ozean"};
      tMax=Math.max(tMax,Tre+15*60);
    } else stage={mode:"orbit",label:["GTO","GEO","GSO","MEO"].includes(orb)?"Oberstufe bleibt in einer hohen Umlaufbahn (Weltraumschrott)":"Oberstufe bleibt vermutlich im Orbit und tritt erst nach Wochen bis Jahren wieder ein"};
  }
  orbits=Math.max(orbits,Math.ceil(tMax/P-0.02));
  let track, retFit=null;
  const tlx=rx=>{ const v=(l.timeline||[]).filter(t=>rx.test(t.type?.abbrev||"")).map(t=>relSec(t.relative_time)).filter(x=>x!=null); return v.length?Math.max(...v):null; };
  const returns = rocket.includes("starship") && !sub && /return|catch|starbase/i.test(desc);
  if(returns){
    // Landezeit aus der Timeline (Catch/Landung), sonst nach den angegebenen Orbits
    const Tl = tlx(/starship catch|starship landing/i) || (orbits*P+40*60);
    const Td = Math.min(tlx(/deorbit burn start/i) || (Tl-57*60), Tl-20*60);
    // Periode + Neigung suchen, bei denen die Bahn zur Landezeit über Starbase liegt
    const tgt=LZ.STARBASE; let best={c:1e9};
    for(let ii=0; ii<=28; ii++){ const inc2=Math.max(Math.abs(lat)+0.05, 26.2+ii*0.25);
      for(let jj=0; jj<=600; jj++){ const P2=P*(0.97+jj*0.0001);
        const q=trackPoint(lat,lon,inc2,false,P2,Tl), c=hav([q[0],q[1]],tgt);
        if(c<best.c) best={c,inc:inc2,P:P2}; } }
    inc=best.inc; P=best.P; tMax=Tl; orbits=Math.ceil(Tl/P);
    track=groundTrack(lat,lon,inc,false,tMax,P);
    // Abstieg: ab dem Deorbit-Burn sanft zum Landeplatz führen
    const kd=track.findIndex(p=>p[2]>=Td), last=track[track.length-1];
    if(kd>0){ let tl=tgt[1]; while(tl-last[1]>180) tl-=360; while(tl-last[1]<-180) tl+=360;
      for(let k=kd;k<track.length;k++){ const f=(track[k][2]-Td)/(Tl-Td), w=f*f*(3-2*f);
        track[k][0]=track[k][0]*(1-w)+tgt[0]*w; track[k][1]=track[k][1]*(1-w)+tl*w; } }
    retFit={km:best.c,Td,Tl};
  } else track=groundTrack(lat,lon,inc,south,tMax,P);
  let cut=track.length;
  if(suborbital){ // Starship: Wasserung im Indischen Ozean

    const la=+(loc.latitude??loc.location?.latitude), lo=+(loc.longitude??loc.location?.longitude);
    if(la&&lo && !(ty==="ASDS")) pos=[la,lo];
    const ab=(loc.abbrev||"").toUpperCase();
    if(!pos && LZ[ab]) pos=LZ[ab];
    if(!pos && /starbase|tower|olp|catch/i.test((loc.name||"")+ty)) pos=LZ.STARBASE;
    if(!pos && /gulf/i.test(loc.name||"")) pos=[26.0,-96.8];
    if(!pos && (ty==="ASDS"||/ocisly|asog|jrti|drone/i.test(loc.name||""))) pos=pointAt(tr,cum, ld.downrange_distance>0?ld.downrange_distance:(orb==="GTO"?650:600));

  });

}


// ===================== Ausgesetzte Nutzlasten (Satelliten hinter der Rakete) =====================
var DEP=null;            // {n,label,times[],src,markers[],lbl}
var depPos=[];           // aktuelle Positionen für den Globus
function relSec(iso){ if(!iso) return null; const m=/(-)?P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:([\d.]+)S)?/.exec(iso); if(!m) return null;
  const s=(+m[2]||0)*86400+(+m[3]||0)*3600+(+m[4]||0)*60+(+m[5]||0); return m[1]?-s:s; }
function payloadPlan(l){
  if(/fail/i.test(l.status?.abbrev||"")) return null;
  const desc=l.mission?.description||"", name=l.name||"", tl=l.timeline||[];
  const orb=(l.mission?.orbit?.abbrev||"").toUpperCase(); if(orb.startsWith("SUB")) return null;
  // Anzahl aus der Missionsbeschreibung (Konstellations-Gesamtzahlen ignorieren)
  let n=null; const re=/(\d+)\s+(?:[\w\-\.]+\s+){0,4}satellites/ig; let m;
  while((m=re.exec(desc))){ const k=+m[1], before=desc.slice(Math.max(0,m.index-70),m.index).toLowerCase();
    if(k>=1 && k<=60 && !/constellation|total|consist|of up to/.test(before)){ n=k; break; } }
  const starlink=/starlink/i.test(name);
  if(n==null) n = starlink ? 24 : 1;
  const label = starlink ? "Starlink" : /dragon|crew|crs/i.test(name) ? "Dragon" : (l.mission?.name||"Nutzlast");

  const f=rx=>{ const e=tl.find(t=>rx.test(t.type?.abbrev||t.type?.description||"")); return e?relSec(e.relative_time):null; };

  if(t0==null){ t0 = starlink ? 3700 : 3000; t1=t0; src="geschätzt"; }

}
function DEPINFO(l){ const p=payloadPlan(l); if(!p) return "";
  return `<div class="note" style="margin-top:10px;color:var(--text)"><span class="lg" style="--c:#ff4fd8"></span><b>Nutzlast:</b> ${p.n>1?p.n+"× ":""}${esc(p.label)} · Aussetzen ${p.t1>p.t0?`T+${mmss(p.t0)} bis T+${mmss(p.t1)}`:`bei T+${mmss(p.t0)}`} <span class="mute">(${p.src})</span>
    <div class="mute" style="margin-top:4px">Die Satelliten erscheinen einzeln hinter der Rakete. Ihr Abstand ist vergrössert dargestellt, damit man sie auf der Karte unterscheiden kann.</div></div>`; }

// Abstand hinter der Rakete: wächst nach dem Aussetzen (vergrössert dargestellt, damit sichtbar)

function parseTLE(t){ const L=t.split(/\r?\n/).map(s=>s.trimEnd()).filter(Boolean), out=[], seen=new Set();
  for(let i=0;i+2<L.length+1;){

  if(!txt){ try{ const r=await fetch(`https://celestrak.org/NORAD/elements/gp.php?GROUP=${SAT_SRC[g].celestrak}&FORMAT=tle`);
      if(!r.ok) throw 0; txt=await r.text(); if(!txt.includes("\n1 ")) throw 0;
      try{ localStorage.setItem("lr_tle_"+g,JSON.stringify({ts:Date.now(),t:txt})); }catch(e){} }catch(e){ txt=null; } }
  if(!txt && TLE_SNAP[g]){ txt=TLE_SNAP[g]; src="snap"; }
  if(!txt){ toast(SAT_SRC[g].label+": nur online verfügbar (im Browser öffnen)"); SATS[g]=[]; return; }
  if(src==="snap") toast(SAT_SRC[g].label+": Bahndaten vom "+SNAP_TS+" (Positionen trotzdem live berechnet)");

  const v=pv.velocity; s.v=Math.hypot(v.x,v.y,v.z); s.ok=true; }

function satTrack(s){ const P=2*Math.PI/s.rec.no, pts=[]; let prev=null,off=0; const t0=simNow().getTime();

    const g=satellite.eciToGeodetic(pv.position,satellite.gstime(d)); let lo=g.longitude*D;
    if(prev!==null){ const dl=lo+off-prev; if(dl>180) off-=360; else if(dl<-180) off+=360; } prev=lo+off; pts.push([g.latitude*D,lo+off]); }
  return pts; }

let lastPoll=0, liveId=null;
function liveCandidate(){ const now=Date.now();

    return l.webcast_live || a==="In Flight" || (t<45*60e3 && t>-3*3600e3 && !/success|fail/i.test(a)); })

  lastPoll=Date.now();
  try{ const r=await fetch(`https://ll.thespacedevs.com/2.3.0/launches/${l.id}/?mode=detailed`); if(!r.ok) throw r.status;

    if(/success|fail/i.test(n.status?.abbrev||"")) setTimeout(()=>refreshCounts(true),60e3); }

  render();

    select(n); const s2=document.getElementById("sim"); if(s2&&!simTimer){ s2.value=v; placeRocket(v); } document.getElementById("panel").scrollTop=top; }

}

var nightLayer=null, lastNight=0;
function sunPos(d){ const n=d.getTime()/86400000+2440587.5-2451545.0, r=Math.PI/180;
  const L0=(280.46+0.9856474*n)%360, g=(357.528+0.9856003*n)*r, lam=(L0+1.915*Math.sin(g)+0.02*Math.sin(2*g))*r, eps=(23.439-4e-7*n)*r;
  const dec=Math.asin(Math.sin(eps)*Math.sin(lam)), ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));
  const gmst=(280.46061837+360.98564736629*n)%360; return {lat:dec/r, lon:norm(ra/r-gmst)}; }
function nightPoly(sun){ const dec=Math.abs(sun.lat)<0.2?(sun.lat<0?-0.2:0.2):sun.lat, pts=[];
  for(let lo=-180;lo<=180;lo+=2) pts.push([Math.atan(-Math.cos((lo-sun.lon)/D)/Math.tan(dec/D))*D,lo]);
  const pole=dec>0?-85:85; return [...pts,[pole,180],[pole,-180]]; }
function updateNight(force){
  const now=Date.now(); if(!force && SIM.speed===1 && now-lastNight<30e3) return; lastNight=now;
  if(!map.getPane("night")){ map.createPane("night"); map.getPane("night").style.zIndex=350; map.getPane("night").style.pointerEvents="none"; }
  if(nightLayer){ map.removeLayer(nightLayer); nightLayer=null; }
  if(!LAYERS.night) return;
  const sun=sunPos(simNow()), poly=nightPoly(sun);
  nightLayer=L.layerGroup([-360,0,360].flatMap(sh=>[
    L.polygon(poly.map(p=>[p[0],p[1]+sh]),{pane:"night",stroke:false,fillColor:"#000",fillOpacity:.5,interactive:false})])).addTo(map);
}
function nightGlobe(c,path,proj){
  if(!LAYERS.night) return; const sun=sunPos(simNow()), anti=[sun.lon+180,-sun.lat];
  c.beginPath(); path(d3.geoCircle().center([sun.lon,sun.lat]).radius(84)()); c.fillStyle="rgba(140,180,255,.10)"; c.fill();
  c.beginPath(); path(d3.geoCircle().center(anti).radius(96)()); c.fillStyle="rgba(0,0,12,.25)"; c.fill();
  c.beginPath(); path(d3.geoCircle().center(anti).radius(90)()); c.fillStyle="rgba(0,0,12,.5)"; c.fill();

}

    g.gain.setValueAtTime(.15,actx.currentTime+t0); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t0+.3);

// ===================== Echte Telemetrie aus dem Livestream (Texterkennung) =====================
var TELE={on:false,d:null,v:null,h:null,last:null,hist:[],region:null,worker:null,busy:false,timer:null,stream:null,video:null,ok:0,bad:0,vh:0};
const TPRESET={s2:[0.64,0.78,0.35,0.21],s1:[0.01,0.78,0.35,0.21]};
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function openTele(){
  const B=document.getElementById("tele"); B.style.display="block";
  if(TELE.on) return teleUI();
  B.innerHTML=`<div class="thd"><b>Echte Telemetrie</b><button class="x" onclick="teleStop()">×</button></div>
   <ol class="tsteps"><li>Öffne den Livestream (YouTube oder X) in einem <b>anderen Tab</b> und lass ihn laufen.</li>
     <li>Tippe unten auf „Stream-Tab teilen“ und wähle diesen Tab aus.</li>
     <li>Ziehe in der Vorschau einen Rahmen um die Anzeige mit Geschwindigkeit und Höhe.</li></ol>
   <button class="btn" onclick="teleStart()">Stream-Tab teilen</button>
   ${PIP.yt?`<button class="btn sec2" onclick="teleAuto()">Mini-Fenster verwenden (1 Klick)</button>`:""}
   <div class="note"><b>Einfacher:</b> Stream im Mini-Fenster abspielen und dort „Telemetrie“ drücken – dann nur noch „Diesen Tab teilen“ bestätigen.</div>
   <div class="note">Funktioniert in Chrome oder Edge am Computer (Bildschirm teilen gibt es auf dem Handy nicht). Die Werte werden lokal per Texterkennung gelesen, nichts wird hochgeladen.</div>`;
}
async function teleStart(){
  if(!navigator.mediaDevices?.getDisplayMedia){ toast("Bildschirm teilen geht hier nicht – Datei in Chrome oder Edge am Computer öffnen"); return; }
  try{ TELE.stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:5},audio:false}); }catch(e){ toast("Teilen abgebrochen"); return; }
  const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.srcObject=TELE.stream; await v.play().catch(()=>{}); TELE.video=v;
  TELE.stream.getVideoTracks()[0].onended=teleStop;
  TELE.on=true; TELE.d=null; TELE.last=null; TELE.hist=[]; TELE.ok=0; TELE.bad=0; TELE.region=TELE.region||TPRESET.s2;
  buildTeleBox(); document.getElementById("tStat").textContent="Texterkennung wird geladen …";
  try{
    if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
    TELE.worker=await Tesseract.createWorker("eng");
    await TELE.worker.setParameters({tessedit_char_whitelist:"0123456789KMHSPEDALTU/ ",tessedit_pageseg_mode:"6"});
  }catch(e){ toast("Texterkennung konnte nicht geladen werden (Internet nötig)"); return teleStop(); }
  TELE.timer=setInterval(teleTick,1000); teleTick();
}
function buildTeleBox(){
  const B=document.getElementById("tele");
  B.innerHTML=`<div class="thd"><b>Echte Telemetrie</b> <span class="pill" id="tBadge" style="background:#33384a;color:#aab">wartet</span><button class="x" onclick="teleStop()">×</button></div>
   <div class="tbig"><div><small>Geschwindigkeit</small><b id="tV">–</b></div><div><small>Höhe</small><b id="tH">–</b></div><div><small>Bodendistanz</small><b id="tD">–</b></div></div>
   <canvas id="tSpark" width="320" height="54"></canvas>
   <canvas id="tPrev" width="320" height="180" title="Rahmen ziehen"></canvas>
   <div class="tbtns"><button class="chip" data-tp="s1">Stufe 1 (links unten)</button><button class="chip" data-tp="s2">Stufe 2 (rechts unten)</button></div>
   <div class="note" id="tStat"></div>`;
  B.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{ TELE.region=TPRESET[b.dataset.tp]; TELE.last=null; drawTelePrev(); });
  const cv=document.getElementById("tPrev"); let st=null;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]; };
  cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); st=pos(e); };
  cv.onpointermove=e=>{ if(!st) return; const q=pos(e); TELE.region=[Math.min(st[0],q[0]),Math.min(st[1],q[1]),Math.max(.03,Math.abs(q[0]-st[0])),Math.max(.03,Math.abs(q[1]-st[1]))]; drawTelePrev(); };
  cv.onpointerup=()=>{ st=null; TELE.last=null; };
}
function drawTelePrev(){
  const cv=document.getElementById("tPrev"), v=TELE.video; if(!cv||!v||!v.videoWidth) return;
  cv.height=Math.round(cv.width*v.videoHeight/v.videoWidth);
  const c=cv.getContext("2d"); c.drawImage(v,0,0,cv.width,cv.height);
  const [x,y,w,hh]=TELE.region; c.fillStyle="rgba(0,0,0,.45)";
  c.fillRect(0,0,cv.width,y*cv.height); c.fillRect(0,(y+hh)*cv.height,cv.width,cv.height); c.fillRect(0,y*cv.height,x*cv.width,hh*cv.height); c.fillRect((x+w)*cv.width,y*cv.height,cv.width,hh*cv.height);
  c.strokeStyle="#4ea1ff"; c.lineWidth=2; c.strokeRect(x*cv.width,y*cv.height,w*cv.width,hh*cv.height); }
async function teleTick(){
  if(!TELE.on||TELE.busy||!TELE.worker||!TELE.video?.videoWidth) return; TELE.busy=true;
  try{
    if(TELE.auto){ const ar=autoRegion(); if(!ar){ TELE.busy=false; return; } TELE.region=ar; }
    const v=TELE.video, W=v.videoWidth, H=v.videoHeight, [rx,ry,rw,rh]=TELE.region;
    const sc=Math.max(1,900/(rw*W)), c=document.createElement("canvas"); c.width=Math.round(rw*W*sc); c.height=Math.round(rh*H*sc);
    const x=c.getContext("2d"); x.drawImage(v,rx*W,ry*H,rw*W,rh*H,0,0,c.width,c.height);
    const im=x.getImageData(0,0,c.width,c.height), p=im.data;          // helle Schrift -> schwarz auf weiss
    for(let i=0;i<p.length;i+=4){ const g=.3*p[i]+.59*p[i+1]+.11*p[i+2], o=g>140?0:255; p[i]=p[i+1]=p[i+2]=o; }
    x.putImageData(im,0,0); drawTelePrev();
    const r=await TELE.worker.recognize(c); teleParse(r.data.text);
  }catch(e){ console.warn(e); }
  TELE.busy=false;
}
function teleParse(text){
  const t=text.toUpperCase().replace(/[^0-9A-Z\n ]/g," ");
  let sp=null, al=null;
  const ms=t.match(/SPEED[^0-9\n]*([0-9][0-9 ]{0,7}[0-9]|[0-9])/), ma=t.match(/ALT[A-Z]*[^0-9\n]*([0-9][0-9 ]{0,5}[0-9]|[0-9])/);
  if(ms) sp=+ms[1].replace(/ /g,""); if(ma) al=+ma[1].replace(/ /g,"");
  if(sp==null||al==null){ const n=(t.replace(/(\d) (\d{3})\b/g,"$1$2").match(/\d{1,6}/g)||[]).map(Number); if(n.length>=2){ if(sp==null) sp=n[0]; if(al==null) al=n[1]; } }
  const now=Date.now(), L=TELE.last;
  let okv = sp!=null && al!=null && sp<=32000 && al<=3000;
  if(okv && L){ const dt=(now-L.t)/1000; if(Math.abs(sp-L.v)>3000*dt+800 || Math.abs(al-L.h)>20*dt+8) okv=false; }
  if(!okv){ TELE.bad++; return teleUI(text); }
  if(L){ const dt=(now-L.t)/1000, vk=(sp+L.v)/2/3600, dh=(al-L.h)/dt; TELE.vh=Math.sqrt(Math.max(0,vk*vk-dh*dh)); TELE.d=(TELE.d||0)+TELE.vh*dt; }
  else if(TELE.d==null){ const ts=selected?(now-new Date(selected.net))/1000:0; TELE.d=(curTrack&&ts>0)?distAt(ts,curTrack):0; }
  TELE.last={t:now,v:sp,h:al}; TELE.v=sp; TELE.h=al; TELE.ok++;
  TELE.hist.push([now,al,sp]); if(TELE.hist.length>900) TELE.hist.shift();
  teleUI(text);
  if(curTrack && selected){ const s=document.getElementById("sim"), ts=Math.max(0,(now-new Date(selected.net))/1000); if(s) s.value=ts; placeRocket(ts); }
}
function teleDist(){ if(!TELE.on||TELE.d==null||!TELE.last) return null; return TELE.d+TELE.vh*Math.min(3,(Date.now()-TELE.last.t)/1000); }
function teleUI(raw){
  const B=document.getElementById("tele"); if(!B||!document.getElementById("tV")) return;
  const fresh=TELE.last && Date.now()-TELE.last.t<4000, badge=document.getElementById("tBadge");
  badge.textContent=fresh?"● gemessen":"keine Werte"; badge.style.background=fresh?"#1f4d33":"#4d3a1f"; badge.style.color=fresh?"#7be07b":"#f5b041";
  document.getElementById("tV").textContent=TELE.v!=null?TELE.v.toLocaleString("de-CH")+" km/h":"–";
  document.getElementById("tH").textContent=TELE.h!=null?TELE.h.toLocaleString("de-CH")+" km":"–";
  document.getElementById("tD").textContent=TELE.d!=null?Math.round(TELE.d).toLocaleString("de-CH")+" km":"–";
  document.getElementById("tStat").textContent=`Gelesen: ${TELE.ok} · verworfen: ${TELE.bad}${raw?` · zuletzt erkannt: „${raw.replace(/\s+/g," ").trim().slice(0,40)}“`:""}`;
  const sp=document.getElementById("tSpark"), c=sp.getContext("2d"); c.clearRect(0,0,sp.width,sp.height);
  const hs=TELE.hist.slice(-300); if(hs.length>1){ const mx=Math.max(...hs.map(q=>q[1]),1), t0=hs[0][0], t1=hs[hs.length-1][0]||t0+1;
    c.beginPath(); hs.forEach((q,i)=>{ const X=(q[0]-t0)/Math.max(1,t1-t0)*(sp.width-4)+2, Y=sp.height-4-(q[1]/mx)*(sp.height-14); i?c.lineTo(X,Y):c.moveTo(X,Y); });
    c.strokeStyle="#4ea1ff"; c.lineWidth=2; c.stroke(); c.fillStyle="#8a96ad"; c.font="10px sans-serif"; c.fillText("Höhe-Verlauf (max "+mx+" km)",4,11); }
}
function teleStop(){
  if(TELE.timer) clearInterval(TELE.timer); TELE.timer=null;
  try{ TELE.stream?.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ TELE.worker?.terminate(); }catch(e){} TELE.worker=null;
  TELE.on=false; TELE.auto=false; TELE.d=null; TELE.last=null; document.getElementById("tele").style.display="none";
  const s=document.getElementById("sim"); if(s&&curTrack) placeRocket(+s.value);
}
document.addEventListener("click",e=>{ if(e.target.closest("#teleBtn")) openTele(); });


// ===================== Statistik & Raketen-Datenbank nach jedem Start nachführen =====================
const CN_DE={"United States of America":"USA","People's Republic of China":"China","Russian Federation":"Russland","New Zealand":"Neuseeland","India":"Indien","Japan":"Japan","France":"Frankreich","Kazakhstan":"Kasachstan","Iran, Islamic Republic of":"Iran","Korea, Republic of":"Südkorea","Korea, Democratic People's Republic of":"Nordkorea","Israel":"Israel","Australia":"Australien","Norway":"Norwegen","Sweden":"Schweden","United Kingdom of Great Britain and Northern Ireland":"Grossbritannien","French Guiana":"Frankreich (Kourou)"};
var STATS0=JSON.parse(JSON.stringify(STATS)), ROCKETS0=JSON.parse(JSON.stringify(ROCKETS)), RCUT=/*RCUT*/;
var FULL={stats:null,db:null};
var INC={ts:null,n:0,busy:false};
function topN(obj,n){ const it=Object.entries(obj).sort((a,b)=>b[1]-a[1]), head=it.slice(0,n), rest=it.slice(n).reduce((s,x)=>s+x[1],0); return rest?[...head,["Andere",rest]]:head; }
function applyIncrement(list){
  // immer vom Schnappschuss ausgehen, damit nichts doppelt gezählt wird
  const S=JSON.parse(JSON.stringify(STATS0)), R=JSON.parse(JSON.stringify(ROCKETS0)), cut=new Date(S.cut), cutR=new Date(RCUT);
  let n=0;
  list.forEach(l=>{ const a=l.status?.abbrev||"", t=new Date(l.net);
    if(!/^(Success|Failure|Partial Failure)$/.test(a)) return;
    if(t>cut || t>cutR) n++;
    if(t>cut && t.getFullYear()===S.year){
      S.total++; S.status[a]=(S.status[a]||0)+1; S.month[t.getMonth()]++;
      const pv=l.launch_service_provider?.name||"?", cn=l.pad?.country?.name||l.pad?.location?.country?.name||"?", rk=l.rocket?.configuration?.full_name||l.rocket?.configuration?.name||"?";
      S.provAll[pv]=(S.provAll[pv]||0)+1; const c2=CN_DE[cn]||cn; S.ctyAll[c2]=(S.ctyAll[c2]||0)+1; S.rockAll[rk]=(S.rockAll[rk]||0)+1; }
    const r=t>cutR ? (R.find(x=>x.id===l.rocket?.configuration?.id) || R.find(x=>x.n===l.rocket?.configuration?.name)) : null;
    if(r){ r.tot++; if(a==="Success") r.suc++; else r.fail++; if(r.pend>0) r.pend--;
      (l.rocket?.launcher_stage||[]).forEach(s=>{ const ld=s.landing; if(ld&&ld.attempt){ r.al++; if(ld.success) r.sl++; } }); }
  });
  S.prov=topN(S.provAll,8); S.cty=topN(S.ctyAll,7); S.rock=topN(S.rockAll,10);
  Object.assign(STATS,S); ROCKETS.length=0; R.forEach(x=>ROCKETS.push(x));
  INC.n=n; }
async function refreshCounts(force){
  if(INC.busy) return; INC.busy=true;
  try{
    let c=null; try{ c=JSON.parse(localStorage.getItem("lr_inc")||"null"); }catch(e){}
    if(!force && c && Date.now()-c.ts<3*3600e3){ applyIncrement(c.data); INC.ts=c.ts; }
    else{
      const since=new Date(Math.min(new Date(STATS0.cut),new Date(RCUT))-3600e3).toISOString();
      const r=await fetch(`https://ll.thespacedevs.com/2.3.0/launches/previous/?mode=detailed&limit=100&ordering=net&net__gte=${since}`);
      if(!r.ok) throw r.status;
      const data=(await r.json()).results.map(l=>({id:l.id,net:l.net,status:{abbrev:l.status?.abbrev},launch_service_provider:{name:l.launch_service_provider?.name},
        pad:{country:{name:l.pad?.country?.name||l.pad?.location?.country?.name}},
        rocket:{configuration:{id:l.rocket?.configuration?.id,name:l.rocket?.configuration?.name,full_name:l.rocket?.configuration?.full_name},
          launcher_stage:(l.rocket?.launcher_stage||[]).map(s=>({landing:{attempt:s.landing?.attempt,success:s.landing?.success}}))}}));
      applyIncrement(data); INC.ts=Date.now();
      try{ localStorage.setItem("lr_inc",JSON.stringify({ts:INC.ts,data})); }catch(e){}
    }
  }catch(e){ if(!INC.ts){ STATS.prov=topN(STATS.provAll,8); STATS.cty=topN(STATS.ctyAll,7); STATS.rock=topN(STATS.rockAll,10); } }
  INC.busy=false; refreshOpenViews();
}
function standText(kind){
  const f=d=>new Date(d).toLocaleString("de-CH",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const full=kind==="db"?FULL.db:FULL.stats;
  if(full && INC.ts) return `vollständig geprüft ${f(full)} · nachgeführt ${f(INC.ts)}${INC.n?` (+${INC.n} Starts)`:""}`;
  return INC.ts ? `aktualisiert ${new Date(INC.ts).toLocaleString("de-CH",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}${INC.n?` · ${INC.n} neue Starts seit Schnappschuss eingerechnet`:""}` : `Schnappschuss vom ${STATS0.asof} (offline)`; }
function refreshOpenViews(){ const P=document.getElementById("panel"); if(P.style.display!=="block") return; const h2=P.querySelector(".hd h2")?.textContent||"";
  if(/Raumfahrt-Statistik/.test(h2)) openStats(); else if(/Raketen-Datenbank/.test(h2)) renderDBTable(); }


// ===================== Vollständige Prüfung: Statistik täglich, Raketen-Datenbank wöchentlich =====================
const LL="https://ll.thespacedevs.com/2.3.0";
async function getAll(url,maxPages){ let out=[], next=url, k=0;
  while(next && k<maxPages){ const r=await fetch(next); if(!r.ok) throw r.status; const j=await r.json(); out=out.concat(j.results||[]); next=j.next; k++;
    if(next) await new Promise(res=>setTimeout(res,1500)); }
  return out; }
function cacheGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function cacheSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function statsFrom(list,year){
  const S={year,asof:new Date().toLocaleDateString("de-CH"),cut:list.reduce((m,x)=>x.net>m?x.net:m,year+"-01-01T00:00:00Z"),
    provAll:{},ctyAll:{},rockAll:{},total:0,status:{},month:Array(12).fill(0)};
  list.forEach(l=>{ const a=l.status?.abbrev||"?"; S.total++; S.status[a]=(S.status[a]||0)+1; S.month[new Date(l.net).getMonth()]++;
    const pv=l.launch_service_provider?.name||"?", cn=l.pad?.country?.name||l.pad?.location?.country?.name||"?", rk=l.rocket?.configuration?.full_name||l.rocket?.configuration?.name||"?";
    S.provAll[pv]=(S.provAll[pv]||0)+1; const c2=CN_DE[cn]||cn; S.ctyAll[c2]=(S.ctyAll[c2]||0)+1; S.rockAll[rk]=(S.rockAll[rk]||0)+1; });
  S.prov=topN(S.provAll,8); S.cty=topN(S.ctyAll,7); S.rock=topN(S.rockAll,10); return S; }
function rocketFrom(c){ const man=c.manufacturer||{}, cty=Array.isArray(man.country)?man.country[0]:man.country, d=(c.description||"").trim();
  return {id:c.id,n:c.name,v:c.variant||"",fam:(c.families||[]).map(x=>x.name).join(", "),man:man.name||"",mab:man.abbrev||"",cty:cty?.alpha_2_code||"",
    act:!!c.active,reu:!!c.reusable,leo:c.leo_capacity,gto:c.gto_capacity,sso:c.sso_capacity,thr:c.to_thrust,len:c.length,dia:c.diameter,mass:c.launch_mass,cost:c.launch_cost,
    tot:c.total_launch_count||0,suc:c.successful_launches||0,fail:c.failed_launches||0,pend:c.pending_launches||0,al:c.attempted_landings||0,sl:c.successful_landings||0,
    csl:c.consecutive_successful_landings,first:c.maiden_flight,img:c.image?.thumbnail_url||null,wiki:c.wiki_url,d:d.slice(0,420)+(d.length>420?"…":"")}; }
async function fullStats(force){
  const c=cacheGet("lr_full_stats");
  if(c && !force && Date.now()-c.ts<24*3600e3){ STATS0=c.S; FULL.stats=c.ts; return; }
  const y=new Date().getFullYear();
  const list=await getAll(`${LL}/launches/previous/?mode=normal&limit=100&ordering=net&net__gte=${y}-01-01T00:00:00Z`,6);
  if(!list.length) return;
  const S=statsFrom(list.filter(l=>!/^(TBD|TBC|Go|Hold)$/.test(l.status?.abbrev||"")),y);
  STATS0=S; FULL.stats=Date.now(); cacheSet("lr_full_stats",{ts:FULL.stats,S});
}
async function fullDB(force){
  const c=cacheGet("lr_full_db");
  if(c && !force && Date.now()-c.ts<7*24*3600e3){ ROCKETS0=c.R; RCUT=new Date(c.ts).toISOString(); FULL.db=c.ts; return; }
  const list=await getAll(`${LL}/launcher_configurations/?mode=detailed&limit=100`,8);
  if(list.length<100) return;                                     // unvollständig → alten Stand behalten
  const R=list.filter(x=>!x.is_placeholder).map(rocketFrom);
  ROCKETS0=R; FULL.db=Date.now(); RCUT=new Date(FULL.db).toISOString();
  if(!cacheSet("lr_full_db",{ts:FULL.db,R})){ const R2=R.map(x=>({...x,d:x.d.slice(0,160)})); cacheSet("lr_full_db",{ts:FULL.db,R:R2}); }
}
async function fullCheck(){
  // gespeicherte Vollstände sofort nutzen
  const cs=cacheGet("lr_full_stats"), cd=cacheGet("lr_full_db");
  if(cs){ STATS0=cs.S; FULL.stats=cs.ts; } if(cd){ ROCKETS0=cd.R; RCUT=new Date(cd.ts).toISOString(); FULL.db=cd.ts; }
  await refreshCounts(false);
  // fällige Vollprüfungen zeitversetzt (Abfragelimit der Gratis-API schonen)
  setTimeout(async()=>{ try{ const due=!cs||Date.now()-cs.ts>=24*3600e3; if(due){ await fullStats(true); await refreshCounts(true); } }catch(e){ console.warn("Statistik-Prüfung",e); } },90e3);
  setTimeout(async()=>{ try{ const due=!cd||Date.now()-cd.ts>=7*24*3600e3; if(due){ await fullDB(true); await refreshCounts(true); } }catch(e){ console.warn("DB-Prüfung",e); } },6*60e3);
}


// ===================== Mini-Fenster für den Livestream =====================
var PIP={yt:null,big:false};
function openPip(yt,title){
  const W=document.getElementById("pip"); PIP.yt=yt;
  W.innerHTML=`<div class="pbar"><b>${esc(title||"Livestream")}</b>
     <button class="chip" id="pTele" title="Telemetrie automatisch aus diesem Fenster lesen">Telemetrie</button>
     <button class="pb" id="pSize" title="Grösse">⤢</button><button class="pb" onclick="closePip()" title="Schliessen">×</button></div>
   <div class="pv"><iframe id="pipFrame" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&mute=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  W.style.display="block"; W.classList.toggle("big",PIP.big);
  document.getElementById("pSize").onclick=()=>{ PIP.big=!PIP.big; W.classList.toggle("big",PIP.big); };
  document.getElementById("pTele").onclick=()=>teleAuto();
  // verschieben
  const bar=W.querySelector(".pbar"); let s=null;
  bar.onpointerdown=e=>{ if(e.target.closest("button")) return; bar.setPointerCapture(e.pointerId); const r=W.getBoundingClientRect(); s=[e.clientX-r.left,e.clientY-r.top]; };
  bar.onpointermove=e=>{ if(!s) return; W.style.left=Math.max(0,Math.min(innerWidth-80,e.clientX-s[0]))+"px"; W.style.top=Math.max(0,Math.min(innerHeight-40,e.clientY-s[1]))+"px"; W.style.right="auto"; W.style.bottom="auto"; };
  bar.onpointerup=()=>{ s=null; };
}
function closePip(){ const W=document.getElementById("pip"); W.style.display="none"; W.innerHTML=""; PIP.yt=null; if(TELE.auto) teleStop(); }
// Telemetrie mit einem Klick: diesen Tab teilen, Bereich = Mini-Fenster (unten rechts = Stufe 2)
async function teleAuto(){
  if(!navigator.mediaDevices?.getDisplayMedia){ toast("Geht nur in Chrome oder Edge am Computer"); return; }
  if(TELE.on) teleStop();
  try{ TELE.stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:5,displaySurface:"browser"},audio:false,preferCurrentTab:true,selfBrowserSurface:"include",surfaceSwitching:"exclude"}); }
  catch(e){ toast("Teilen abgebrochen"); return; }
  const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.srcObject=TELE.stream; await v.play().catch(()=>{}); TELE.video=v;
  TELE.stream.getVideoTracks()[0].onended=teleStop;
  TELE.on=true; TELE.auto=true; TELE.sub=TPRESET.s2; TELE.d=null; TELE.last=null; TELE.hist=[]; TELE.ok=0; TELE.bad=0;
  document.getElementById("tele").style.display="block"; buildTeleBox();
  document.querySelectorAll("#tele [data-tp]").forEach(b=>b.onclick=()=>{ TELE.sub=TPRESET[b.dataset.tp]; TELE.last=null; });
  document.getElementById("tStat").textContent="Texterkennung wird geladen …";
  try{ if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
    TELE.worker=await Tesseract.createWorker("eng"); await TELE.worker.setParameters({tessedit_char_whitelist:"0123456789KMHSPEDALTU/ ",tessedit_pageseg_mode:"6"}); }
  catch(e){ toast("Texterkennung konnte nicht geladen werden"); return teleStop(); }
  TELE.timer=setInterval(teleTick,1000); teleTick();
}
// Bereich im geteilten Tab aus der Lage des Mini-Fensters berechnen
function autoRegion(){ const f=document.getElementById("pipFrame"); if(!f) return null; const r=f.getBoundingClientRect(), s=TELE.sub||TPRESET.s2;
  return [(r.left+s[0]*r.width)/innerWidth,(r.top+s[1]*r.height)/innerHeight,s[2]*r.width/innerWidth,s[3]*r.height/innerHeight]; }

// ===================== Layout & Start =====================
function layoutTop(){ const hh=document.querySelector("header").offsetHeight;
  document.getElementById("live").style.top=(hh+4)+"px"; document.getElementById("layers").style.top=(hh+4)+"px";
  document.getElementById("panel").style.top=innerWidth>=800?(hh+6)+"px":"";
  const ms=document.getElementById("msg"); if(innerWidth<800){ ms.style.top=(hh+50)+"px"; ms.style.bottom="auto"; } else { ms.style.top=""; ms.style.bottom=""; } }
addEventListener("resize",layoutTop);
document.getElementById("statBtn").onclick=openStats;
document.getElementById("dbBtn").onclick=()=>openDB();
buildTimebar(); layoutTop(); updateNight(true); updTimeUI();
fullCheck(); setInterval(()=>refreshCounts(false),3*3600e3); setInterval(fullCheck,6*3600e3);
setTimeout(async()=>{ if(LAYERS.fresh){ await loadSats("starlink"); setFresh(); } },1500);

setInterval(load, CACHE_MIN*60e3+5000);
load();
