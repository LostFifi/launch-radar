# Cloudflare Worker für LaunchRadar – Anleitung: worker/README.md
name = "launch-radar"
main = "src/index.js"
compatibility_date = "2025-06-01"

# alle 5 Minuten: Starts neu laden + Erinnerungen prüfen
[triggers]
crons = ["*/5 * * * *"]

# KV-Speicher: ID nach "npx wrangler kv namespace create LR" hier eintragen
[[kv_namespaces]]
binding = "LR"
id = "557bd845c2704bf094e69c259710b217"

[vars]
ALLOW_ORIGIN = "https://launch-radar.com,https://www.launch-radar.com,https://lostfifi.github.io"

# Live-Telemetrie-Verteiler wieder entfernt (v1 angelegt, v2 gelöscht)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeleHub"]

[[migrations]]
tag = "v2"
deleted_classes = ["TeleHub"]
